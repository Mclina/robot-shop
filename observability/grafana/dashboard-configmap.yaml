apiVersion: v1
data:
  robot-shop.json: |
    {
      "id": null,
      "uid": "493ecd5a-446b-4bf8-bd28-1310cb1a1f30",
      "title": "Robot Shop Kubernetes Monitoring",
      "tags": [
        "robot-shop",
        "kubernetes",
        "prometheus"
      ],
      "timezone": "browser",
      "schemaVersion": 39,
      "version": 1,
      "refresh": "30s",
      "panels": [
        {
          "id": 1,
          "title": "Monitoring Targets Up",
          "type": "stat",
          "datasource": {
            "type": "prometheus",
            "uid": "PBFA97CFB590B2093"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 0
          },
          "targets": [
            {
              "expr": "up",
              "refId": "A"
            }
          ]
        },
        {
          "id": 2,
          "title": "Available Node Memory",
          "type": "timeseries",
          "datasource": {
            "type": "prometheus",
            "uid": "PBFA97CFB590B2093"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 0
          },
          "targets": [
            {
              "expr": "node_memory_MemAvailable_bytes",
              "refId": "A"
            }
          ]
        },
        {
          "id": 3,
          "title": "Active Nginx Connections",
          "type": "stat",
          "datasource": {
            "type": "prometheus",
            "uid": "PBFA97CFB590B2093"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 8
          },
          "targets": [
            {
              "expr": "nginx_connections_active",
              "refId": "A"
            }
          ]
        },
        {
          "id": 4,
          "title": "HTTP Requests per Second",
          "type": "timeseries",
          "datasource": {
            "type": "prometheus",
            "uid": "PBFA97CFB590B2093"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 8
          },
          "targets": [
            {
              "expr": "rate(nginx_http_requests_total[5m])",
              "refId": "A"
            }
          ]
        },
        {
          "id": 5,
          "title": "Connections Handled per Second",
          "type": "timeseries",
          "datasource": {
            "type": "prometheus",
            "uid": "PBFA97CFB590B2093"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 16
          },
          "targets": [
            {
              "expr": "rate(nginx_connections_handled[5m])",
              "refId": "A"
            }
          ]
        }
      ]
    }
kind: ConfigMap
metadata:
  labels:
    grafana_dashboard: "1"
  name: robot-shop-dashboard
  namespace: observability
