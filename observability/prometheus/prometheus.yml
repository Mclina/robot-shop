global:
  scrape_interval: 30s
  evaluation_interval: 30s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: node-exporter
    static_configs:
      - targets: ["node-exporter-prometheus-node-exporter.observability.svc.cluster.local:9100"]

  - job_name: kube-state-metrics
    static_configs:
      - targets: ["kube-state-metrics.observability.svc.cluster.local:8080"]
  - job_name: nginx-exporter
    static_configs:
      - targets: ["web-metrics.robot-shop.svc.cluster.local:9113"]
