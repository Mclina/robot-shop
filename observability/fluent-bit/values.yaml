image:
  repository: fluent/fluent-bit
  tag: "5.1.3"

resources:
  requests:
    cpu: 10m
    memory: 32Mi
  limits:
    cpu: 100m
    memory: 128Mi

config:
  outputs: |
    [OUTPUT]
        Name loki
        Match kube.*
        Host loki-gateway.observability.svc.cluster.local
        Port 80
        Labels job=fluent-bit, namespace=$kubernetes['namespace_name'], pod=$kubernetes['pod_name']
        Auto_Kubernetes_Labels On
        Line_Format json
